name: Compatibility report
description: Report how a CRP block behaved in a model, runtime, or integration.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: >-
        Compatibility reports should distinguish observed results from
        interpretation and should not include confidential prompts or data.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Identify the model, runtime, interface, and relevant version.
      placeholder: Provider, model/runtime version, interface
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: CRP mode
      options:
        - HOT-RESUME
        - COLD-RESUME
        - HANDOFF
        - TRANSPOSE
        - FORK
        - RECOVERY
        - MERGE-NOTE
        - CHECKPOINT
    validations:
      required: true

  - type: textarea
    id: procedure
    attributes:
      label: Reproduction procedure
      description: Describe the loader, sanitized block shape, and evaluation steps.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Observed result
      description: Report what was preserved, lost, or reconstructed incorrectly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Reporting checks
      options:
        - label: I removed secrets, personal data, and private project context.
          required: true
        - label: I have labeled inference separately from direct observation.
          required: true
